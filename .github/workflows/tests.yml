# Tests de l'API et compilation de l'interface, à chaque push et pull request
name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Interface compilée et navigateur : tests d'écran (0.6.0)
      - run: cd frontend && npm ci && npx vite build
      - run: pip install -r requirements-dev.txt && python -m playwright install --with-deps chromium
      - run: python -m pytest -q

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npx vite build
